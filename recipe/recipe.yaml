context:
  name: airflow-laminar
  version: "1.19.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/airflow-laminar/airflow_laminar-${{ version }}.tar.gz
  sha256: 6bfb00d1ef51087700d9692b707e5a94e539dae412568f0f693b10afcdab657a

build:
  number: 0
  noarch: python
  script: python -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - hatchling
  run:
    - python >=${{ python_min }}
    - airflow-balancer >=0.7.12,<0.8
    - airflow-common >=0.7.10,<0.8
    - airflow-config >=1.12.6,<1.13
    - airflow-cron >=0.1.2,<0.2
    - airflow-ha >=1.6.7,<1.7
    - airflow-nomad >=0.2.1,<0.3
    - airflow-priority >=1.6.3,<1.7
    - airflow-pydantic >=1.7.1,<1.8
    - airflow-supervisor >=1.11.1,<1.12
    - cron-pydantic >=0.1.1,<0.2
    - nomad-pydantic >=0.2.1,<0.3
    - supervisor-pydantic >=1.5.2,<1.6

tests:
  - python:
      imports:
        - airflow_laminar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: Meta-repository for airflow-laminar tools
  homepage: https://github.com/airflow-laminar/airflow-laminar
  repository: https://github.com/airflow-laminar/airflow-laminar

extra:
  recipe-maintainers:
    - timkpaine
